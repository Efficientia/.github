# Caminho no repo .github: .github/workflows/ci-python-fastapi.yml
name: Global CI - Python FastAPI & LangGraph AI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'

jobs:
  test-and-lint:
    name: Python Tests, Multiagent Validation & Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      - name: Executar linter
        run: |
          pip install flake8 pytest
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Testes Automáticos dos Agentes
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest --maxfail=1 --disable-warnings -q
          else
            echo "Nenhum teste Python encontrado; etapa ignorada."
          fi
